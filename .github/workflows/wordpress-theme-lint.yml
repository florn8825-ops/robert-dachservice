name: WordPress Theme Lint

on:
  push:
    branches:
      - wordpress-conversion
  pull_request:
    branches:
      - wordpress-conversion

jobs:
  php-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
      - name: PHP syntax check
        shell: bash
        run: |
          set -euo pipefail
          find wordpress-theme/robert-dachservice -type f -name '*.php' -print0 | while IFS= read -r -d '' file; do
            echo "Checking $file"
            php -l "$file"
          done
